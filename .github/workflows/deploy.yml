name: Build and Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  SERVER_PATH: "/home/webapp/projects/ayni/api_ayni"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
      - run: npm run build
      - run: npx prisma generate

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json
            prisma/
            ecosystem.config.js
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Confiar en el host remoto
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Asegurar carpeta remota
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ env.SERVER_PATH }}"

      - name: Sincronizar archivos
        run: |
          rsync -atv --delete \
            --exclude '.env.production' --exclude '.env' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SERVER_PATH }}/

      - name: Reiniciar app con PM2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ env.SERVER_PATH }} &&
            pm2 startOrRestart ecosystem.config.js --env production
          "
