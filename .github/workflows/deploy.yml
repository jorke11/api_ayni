name: Build and Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  SERVER_PATH: "/home/webapp/projects/ayni/api_ayni"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
      - run: npm run build
      - run: npx prisma generate

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json
            prisma/
            ecosystem.config.js
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Normalizar variables del servidor
        run: |
          HOST=$(printf '%s' "${{ secrets.SSH_HOST }}" | tr -d '[:space:]')
          USER=$(printf '%s' "${{ secrets.SSH_USER }}" | tr -d '[:space:]')
          echo "SSH_HOST_CLEAN longitud: ${#HOST}"
          echo "SSH_USER_CLEAN longitud: ${#USER}"
          echo "SSH_HOST_CLEAN=$HOST" >> "$GITHUB_ENV"
          echo "SSH_USER_CLEAN=$USER" >> "$GITHUB_ENV"

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Confiar en el host remoto
        run: |
          mkdir -p ~/.ssh
          # El servidor corre Dropbear (SSH legacy): solo ofrece host key tipo
          # ssh-rsa, deprecado por defecto en OpenSSH moderno. Lo habilitamos
          # explícitamente para este host.
          cat >> ~/.ssh/config <<EOF
          Host $SSH_HOST_CLEAN
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          EOF
          ssh-keyscan -H "$SSH_HOST_CLEAN" >> ~/.ssh/known_hosts

      - name: Asegurar carpeta remota
        run: ssh "$SSH_USER_CLEAN@$SSH_HOST_CLEAN" "mkdir -p ${{ env.SERVER_PATH }}"

      - name: Sincronizar archivos
        run: |
          rsync -atv --delete \
            --exclude '.env.production' --exclude '.env' \
            ./ "$SSH_USER_CLEAN@$SSH_HOST_CLEAN:${{ env.SERVER_PATH }}/"

      - name: Generar Prisma Client en el servidor
        run: |
          ssh "$SSH_USER_CLEAN@$SSH_HOST_CLEAN" "
            cd ${{ env.SERVER_PATH }} &&
            node node_modules/prisma/build/index.js generate
          "

      - name: Reiniciar app con PM2
        run: |
          ssh "$SSH_USER_CLEAN@$SSH_HOST_CLEAN" "
            cd ${{ env.SERVER_PATH }} &&
            pm2 startOrRestart ecosystem.config.js --env production
          "
